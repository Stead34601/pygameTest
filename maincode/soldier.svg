<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <g transform="translate(120 120)">
    <!-- central mass under the head -->
    <path d="M-34 12 Q0 -6 34 12 L28 26 Q0 34 -28 26 Z" fill="#586067"/>

    <!-- head sitting directly over center mass -->
    <circle cx="0" cy="-10" r="20" fill="#d7b18b"/>
    <circle cx="0" cy="-10" r="15" fill="#bf8a67" opacity="0.35"/>
    <path d="M-17 -14 Q0 -28 17 -14" fill="none" stroke="#7a6857" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 -12 H10" stroke="#5b392c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-6" cy="-13" r="2.3" fill="#1b1b1b"/>
    <circle cx="6" cy="-13" r="2.3" fill="#1b1b1b"/>

    <!-- left arm and clamp merged into body mass -->
    <path d="M-24 12 L-52 24 L-68 20 L-82 30 L-98 30 L-104 24 L-90 14 L-78 18 Z" fill="#d7d7d7" stroke="#666" stroke-width="2"/>
    <path d="M-24 12 L-46 12" fill="none" stroke="#d7b18b" stroke-width="8" stroke-linecap="round"/>

    <!-- right side merged into center mass -->
    <path d="M24 12 L44 18 L60 18" fill="none" stroke="#d7b18b" stroke-width="8" stroke-linecap="round"/>

    <!-- gun facing left (270°) and centered at the body mass -->
    <g transform="translate(60 18) rotate(270)">
      <rect x="0" y="-6" width="42" height="12" rx="3" fill="#2a2b2d"/>
      <rect x="34" y="-8" width="18" height="16" rx="2" fill="#4b4d50"/>
      <rect x="48" y="-10" width="14" height="20" rx="2" fill="#8b8f92"/>
      <rect x="8" y="-9" width="10" height="18" rx="2" fill="#44474b"/>
      <circle cx="11" cy="0" r="3" fill="#dde3e8"/>
    </g>
  </g>
</svg>
