<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a6b42"/>
      <stop offset="100%" stop-color="#6f4d33"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f989e"/>
      <stop offset="100%" stop-color="#636c73"/>
    </linearGradient>
  </defs>

  <g transform="translate(1 10)">

  <!-- Shoulder pods -->
  <ellipse cx="43" cy="64" rx="10" ry="15" fill="url(#armor)" transform="rotate(-18 43 64)"/>
  <ellipse cx="85" cy="64" rx="10" ry="15" fill="url(#armor)" transform="rotate(18 85 64)"/>

  <!-- Left arm reaches up to clamp the gun -->
  <path d="M37 70 C31 63, 34 51, 45 45 C52 42, 57 43, 60 46 C54 49, 49 54, 46 61 C44 65, 42 68, 37 70" fill="#8f5f3b"/>
  <path d="M47 59 C43 52, 45 42, 52 34 C56 29, 59 27, 62 26 C61 30, 60 34, 60 39 C60 45, 58 50, 55 55 C52 59, 49 61, 47 59 Z" fill="#9a6b46"/>

  <!-- Main torso -->
  <ellipse cx="64" cy="66" rx="24" ry="27" fill="url(#armor)"/>
  <ellipse cx="64" cy="66" rx="18" ry="21" fill="#8a5f3d" opacity="0.6"/>

  <!-- Gun pointed upward (drawn under head/hands for occlusion) -->
  <g transform="translate(64 44)">
    <rect x="-4" y="-34" width="8" height="34" rx="2" fill="#6f787f"/>
    <rect x="-5" y="-48" width="10" height="14" rx="2" fill="#8a949b"/>
  </g>

  <!-- Head / helmet facing upward -->
  <ellipse cx="64" cy="50" rx="15" ry="13" fill="#bc875d"/>

  <!-- Left hand C-clamp around the gun (moved higher) -->
  <path d="M60 32 C56 31, 53 29, 52 25 C51 20, 55 17, 61 16 C64 16, 66 17, 67 19 C64 21, 63 23, 63 26 C63 29, 65 31, 68 32 C66 34, 63 34, 60 32 Z" fill="#c08c66"/>

  <!-- Highlights -->
  <path d="M49 56 C55 47, 73 46, 79 56" fill="none" stroke="#c5966f" stroke-width="2" opacity="0.55"/>
  <path d="M44 72 C52 80, 76 80, 84 72" fill="none" stroke="#5b3f2b" stroke-width="2" opacity="0.45"/>
  </g>

</svg>
